<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Categorías">
      <ng-template #headerOptionsTemplate>
        <button [routerLink]="['/categories/create']" class="btn btn-primary" [disabled]="isLoading">
          <i class="ti ti-plus"></i> Nueva categoría
        </button>
      </ng-template>

      @if (isLoading) {
        <div class="text-center p-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-2">Cargando categorías...</p>
        </div>
      }

      @if (!isLoading) {
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              @for (category of categories; track category) {
                <tr>
                  <td>{{ category.name }}</td>
                  <td>{{ category.description }}</td>
                    <td class="text-end">
                    <a [routerLink]="['/categories/edit', category.id]"
                      class="btn btn-icon btn-outline-primary btn-sm me-2">
                      <i class="ti ti-edit"></i>
                    </a>
                    <button (click)="deleteCategory(category.id)"
                      class="btn btn-icon btn-outline-danger btn-sm" [disabled]="isLoading">
                      <i class="ti ti-trash"></i>
                    </button>
                  </td>
                </tr>
              }
              @if (categories.length === 0) {
                <tr>
                  <td colspan="3" class="text-center">No se encontraron categorías.</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </app-card>
  </div>
</div>
