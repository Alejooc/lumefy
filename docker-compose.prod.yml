x-backend-service: &backend-service
  build: ./backend
  image: lumefy-backend:${LUMEFY_IMAGE_TAG:-local}
  env_file:
    - ${BACKEND_ENV_FILE:-./backend/.env.production}
  environment:
    REDIS_URL: redis://redis:6379/0
  init: true
  security_opt:
    - no-new-privileges:true
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file: ${ROOT_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-service
    restart: "no"
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    volumes:
      - backend_static:/app/static
    networks:
      default: {}
      proxy:
        aliases:
          - lumefy-backend
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  outbox-relay:
    <<: *backend-service
    restart: unless-stopped
    command: python -m app.workers.outbox_relay
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  operations-consumer:
    <<: *backend-service
    restart: unless-stopped
    command: python -m app.workers.operations_consumer
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      outbox-relay:
        condition: service_started

  email-delivery-worker:
    <<: *backend-service
    restart: unless-stopped
    command: python -m app.workers.email_delivery_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      operations-consumer:
        condition: service_started

  integration-sync-worker:
    <<: *backend-service
    restart: unless-stopped
    command: python -m app.workers.integration_sync_worker
    environment:
      REDIS_URL: redis://redis:6379/0
      INTEGRATION_SYNC_POLL_SECONDS: "2"
      INTEGRATION_SYNC_STALE_MINUTES: "60"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend_mantis
    image: lumefy-frontend:${LUMEFY_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default: {}
      proxy:
        aliases:
          - lumefy-frontend
          - frontend

  storefront:
    build:
      context: ./storefront_nextmerce
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_PLATFORM_STOREFRONT_DOMAIN: ${PLATFORM_STOREFRONT_DOMAIN}
    image: lumefy-storefront:${LUMEFY_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_PLATFORM_STOREFRONT_DOMAIN: ${PLATFORM_STOREFRONT_DOMAIN}
      INTERNAL_API_URL: http://backend:8000/api/v1
      NEXT_IMAGE_ALLOW_LOCAL_IP: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default: {}
      proxy:
        aliases:
          - lumefy-storefront
          - storefront

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - backend_static:/var/www/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      storefront:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-lumefy_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-lumefy_redis_data}
  backend_static:
    name: ${BACKEND_STATIC_VOLUME:-lumefy_backend_static}
  caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-lumefy_caddy_data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-lumefy_caddy_config}

networks:
  proxy:
    name: ${PROXY_NETWORK:-npm_default}
    external: true
