name: Validate and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production rollout midway. Superseded PR validation can stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend, migrations and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: lumefy_ci
          POSTGRES_PASSWORD: lumefy_ci_password
          POSTGRES_DB: lumefy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumefy_ci -d lumefy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lumefy_ci
      POSTGRES_PASSWORD: lumefy_ci_password
      POSTGRES_DB: lumefy_ci
      DATABASE_URL: postgresql+asyncpg://lumefy_ci:lumefy_ci_password@localhost:5432/lumefy_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: 7_DFsXGF8kV22fon1jo7foNqIIICJcncrP4DvaedYpw=
      ENVIRONMENT: production
      SQL_ECHO: "false"
      FRONTEND_URL: http://localhost:4200
      FIRST_SUPERUSER: admin-ci@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-admin-password
      BACKEND_CORS_ORIGINS: '["http://localhost:4200"]'
      PLATFORM_STOREFRONT_DOMAIN: localhost
      MAIL_SERVER: smtp.example.com
      MAIL_USERNAME: ci-smtp@example.com
      MAIL_PASSWORD: ci-only-smtp-password
      MAIL_FROM: no-reply@example.com
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --disable-pip
      - name: Run backend tests
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Exercise complete migration chain
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          alembic current --check-heads
          alembic downgrade -1
          alembic upgrade head
          alembic current --check-heads
      - name: Smoke-test API against PostgreSQL
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lumefy-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz; then
              curl --fail --silent --show-error http://127.0.0.1:8000/healthz
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lumefy-api.log
          exit 1

  frontends:
    name: Frontends and runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend_mantis/package-lock.json
            storefront_nextmerce/package-lock.json
      - name: Validate Angular admin
        working-directory: frontend_mantis
        run: |
          npm ci
          npm run lint
          npm test -- --watch=false
          npm run build
          npm audit --omit=dev --audit-level=moderate
      - name: Validate Next storefront
        working-directory: storefront_nextmerce
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_STOREFRONT_ID: placeholder
          NEXT_PUBLIC_PLATFORM_STOREFRONT_DOMAIN: localhost
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=moderate

  containers:
    name: Production containers and internal smoke test
    needs: [backend, frontends]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROOT_ENV_FILE: .env.ci-root
      BACKEND_ENV_FILE: ./backend/.env.ci
      LUMEFY_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create isolated container environment
        run: |
          cat > .env.ci-root <<'EOF'
          POSTGRES_USER=lumefy
          POSTGRES_PASSWORD=ci-container-database-password
          POSTGRES_DB=lumefy
          ADMIN_DOMAIN=admin.localhost
          PLATFORM_STOREFRONT_DOMAIN=localhost
          ACME_EMAIL=ops@example.com
          PROXY_NETWORK=npm_default
          BACKUP_RETENTION_DAYS=14
          POSTGRES_VOLUME_NAME=lumefy_ci_postgres_data
          REDIS_VOLUME_NAME=lumefy_ci_redis_data
          BACKEND_STATIC_VOLUME=lumefy_ci_backend_static
          CADDY_DATA_VOLUME_NAME=lumefy_ci_caddy_data
          CADDY_CONFIG_VOLUME_NAME=lumefy_ci_caddy_config
          EOF
          cat > backend/.env.ci <<'EOF'
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_USER=lumefy
          POSTGRES_PASSWORD=ci-container-database-password
          POSTGRES_DB=lumefy
          DATABASE_URL=postgresql+asyncpg://lumefy:ci-container-database-password@db:5432/lumefy
          REDIS_URL=redis://redis:6379/0
          SECRET_KEY=ci-only-secret-key-with-at-least-32-characters
          CREDENTIAL_ENCRYPTION_KEY=7_DFsXGF8kV22fon1jo7foNqIIICJcncrP4DvaedYpw=
          ENVIRONMENT=production
          SQL_ECHO=false
          FRONTEND_URL=http://frontend
          FIRST_SUPERUSER=admin-ci@example.com
          FIRST_SUPERUSER_PASSWORD=ci-only-admin-password
          BACKEND_CORS_ORIGINS=["http://frontend"]
          PLATFORM_STOREFRONT_DOMAIN=localhost
          MAIL_SERVER=smtp.example.com
          MAIL_USERNAME=ci-smtp@example.com
          MAIL_PASSWORD=ci-only-smtp-password
          MAIL_FROM=no-reply@example.com
          EOF
          docker network inspect npm_default >/dev/null 2>&1 || docker network create npm_default
      - name: Validate Compose and build production images
        run: |
          docker compose --env-file "$ROOT_ENV_FILE" -f docker-compose.prod.yml config --quiet
          docker compose --env-file "$ROOT_ENV_FILE" -f docker-compose.prod.yml build backend frontend storefront
      - name: Verify image boundaries
        run: |
          docker run --rm --entrypoint sh "lumefy-backend:$LUMEFY_IMAGE_TAG" -c \
            'test "$(id -u)" != 0 && test ! -e /app/.env && test ! -e /app/tests'
          docker run --rm --entrypoint sh "lumefy-storefront:$LUMEFY_IMAGE_TAG" -c \
            'test "$(id -u)" != 0 && test ! -e /app/.env'
      - name: Start and smoke-test the production topology
        run: |
          cleanup() {
            docker compose --env-file "$ROOT_ENV_FILE" -f docker-compose.prod.yml \
              down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose --env-file "$ROOT_ENV_FILE" -f docker-compose.prod.yml \
            up -d --wait --wait-timeout 180
          sh scripts/smoke-production.sh

  deploy:
    name: Deploy reviewed revision
    needs: [backend, frontends, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy exact revision on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TARGET_REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          deploy_path_b64=$(printf '%s' "$DEPLOY_PATH" | base64 -w0)
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_B64=$deploy_path_b64 TARGET_REVISION=$TARGET_REVISION sh -s" <<'REMOTE'
          set -eu
          deploy_path=$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)
          cd "$deploy_path"
          git diff --quiet
          git diff --cached --quiet
          previous_revision=$(git rev-parse HEAD)
          git fetch --prune origin main
          git cat-file -e "$TARGET_REVISION^{commit}"
          git merge-base --is-ancestor "$TARGET_REVISION" origin/main
          git checkout --detach "$TARGET_REVISION"
          PREVIOUS_REVISION="$previous_revision" \
            LUMEFY_IMAGE_TAG="$TARGET_REVISION" \
            sh scripts/deploy-production.sh
          REMOTE
